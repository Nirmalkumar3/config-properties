spring:
  r2dbc:
    url: r2dbc:h2:mem:///sagadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:9000"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/